
[functions.send-reminders]
enabled = true
verify_jwt = true
import_map = "./functions/send-reminders/deno.json"
entrypoint = "./functions/send-reminders/index.ts"

[functions.reconcile-expenses]
enabled = true
verify_jwt = true
import_map = "./functions/reconcile-expenses/deno.json"
entrypoint = "./functions/reconcile-expenses/index.ts"

# Cron jobs - use dynamic URL functions with service role auth
[cron.jobs.send-reminders]
schedule = "0 7 * * *"
command = "SELECT net.http_post(public.get_send_reminders_url(), '{}', jsonb_build_object('Content-Type', 'application/json', 'Authorization', 'Bearer ' || current_setting('supabase.service_role_key', true)), 'application/json');"

[cron.jobs.reconcile-expenses]
schedule = "0 3 * * *"
command = "SELECT net.http_post(public.get_reconcile_expenses_url(), '{}', jsonb_build_object('Content-Type', 'application/json', 'Authorization', 'Bearer ' || current_setting('supabase.service_role_key', true)), 'application/json');"
